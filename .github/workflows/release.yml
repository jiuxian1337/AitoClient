name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :1.8.9-forge:build --no-daemon

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp versions/1.8.9-forge/build/libs/*.jar dist/
          rm -f dist/*-dev.jar dist/*-sources.jar

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
